<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chattie</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI';
    background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    color:white;
}

/* Container */
#app {
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* Header */
#header {
    text-align:center;
    padding:10px;
    font-size:18px;
}

/* Video */
#video-container {
    display:none;
    justify-content:center;
    gap:10px;
}

video {
    width:45%;
    border-radius:10px;
}

/* Chat */
#chat-box {
    flex:1;
    overflow-y:auto;
    padding:10px;
}

.msg {
    margin:5px 0;
}

/* Input area */
#input-area {
    display:flex;
    gap:5px;
    padding:10px;
}

#msg-input {
    flex:1;
    padding:10px;
    border-radius:20px;
    border:none;
}

button {
    padding:10px;
    border:none;
    border-radius:20px;
}

/* Bottom controls */
#controls {
    display:flex;
    justify-content:space-around;
    padding:5px;
}

/* Emoji */
#emoji-box {
    display:none;
    padding:5px;
    text-align:center;
}

#emoji-box span {
    font-size:22px;
    padding:5px;
    cursor:pointer;
}

/* Desktop */
@media (min-width: 768px) {
    #chat-box {
        max-width:600px;
        margin:auto;
    }
}
</style>
</head>

<body>

<div id="app">

<div id="header">Chattie 💬</div>
<div id="status" style="text-align:center;"></div>

<div id="video-container">
    <video id="local-video" autoplay muted></video>
    <video id="remote-video" autoplay></video>
</div>

<div id="chat-box"></div>

<div id="emoji-box">
    <span>😀</span><span>😂</span><span>😍</span><span>😎</span>
    <span>🔥</span><span>❤️</span><span>👍</span><span>💀</span>
</div>

<div id="input-area">
    <input id="msg-input" placeholder="Message..." />
    <button onclick="sendMessage()">➤</button>
</div>

<div id="controls">
    <button onclick="toggleEmoji()">😄</button>
    <button onclick="document.getElementById('image-input').click()">🖼️</button>
    <button onclick="toggleVideo()">📹</button>
    <button onclick="nextStranger()">⏭️</button>
    <button onclick="logout()">🚪</button>
</div>

<input type="file" id="image-input" style="display:none"/>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

<script>
const socket = io();

let localStream=null;
let peerConnection=null;
let isVideoOn=false;

const config={ iceServers:[{urls:'stun:stun.l.google.com:19302'}] };

socket.on('connect',()=> socket.emit('join'));
socket.on('waiting',d=>status(d.msg));
socket.on('connected',d=>status(d.msg));

socket.on('message',d=>addMessage(d.msg,d.user));
socket.on('image',d=>addImage(d.img,d.user));

function status(msg){
    document.getElementById('status').innerText=msg;
}

function addMessage(msg,user){
    const box=document.getElementById('chat-box');
    const div=document.createElement('div');
    div.className='msg';
    div.innerText=user+": "+msg;
    box.appendChild(div);
    box.scrollTop=box.scrollHeight;
}

function addImage(img,user){
    const box=document.getElementById('chat-box');
    const div=document.createElement('div');
    div.className='msg';

    const image=document.createElement('img');
    image.src=img;
    image.style.width="150px";

    div.append(user+": ");
    div.appendChild(image);

    box.appendChild(div);
    box.scrollTop=box.scrollHeight;
}

function sendMessage(){
    const input=document.getElementById('msg-input');
    const msg=input.value.trim();
    if(!msg) return;

    socket.emit('message',{msg});
    input.value='';
}

function nextStranger(){
    document.getElementById('chat-box').innerHTML='';
    stopVideo();
    socket.emit('next');
}

function logout(){
    window.location.href="/logout";
}

/* Emoji */
function toggleEmoji(){
    const box=document.getElementById('emoji-box');
    box.style.display=box.style.display==="none"?"block":"none";
}

document.getElementById('emoji-box').onclick=e=>{
    if(e.target.tagName==="SPAN"){
        document.getElementById('msg-input').value+=e.target.innerText;
    }
};

/* Image */
document.getElementById('image-input').addEventListener('change',e=>{
    const file=e.target.files[0];
    if(!file) return;

    const reader=new FileReader();
    reader.onload=evt=>{
        socket.emit('image',{img:evt.target.result});
        addImage(evt.target.result,"Tum");
    };
    reader.readAsDataURL(file);
});

/* Video */
function createPeer(){
    peerConnection=new RTCPeerConnection(config);

    if(localStream){
        localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream));
    }

    peerConnection.ontrack=e=>{
        document.getElementById('remote-video').srcObject=e.streams[0];
    };

    peerConnection.onicecandidate=e=>{
        if(e.candidate) socket.emit('webrtc_ice',e.candidate);
    };
}

async function toggleVideo(){
    if(!isVideoOn){
        localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
        document.getElementById('video-container').style.display='flex';
        document.getElementById('local-video').srcObject=localStream;

        createPeer();

        const offer=await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        socket.emit('webrtc_offer',offer);

        isVideoOn=true;
    }else{
        stopVideo();
    }
}

function stopVideo(){
    if(localStream){
        localStream.getTracks().forEach(t=>t.stop());
        localStream=null;
    }

    if(peerConnection){
        peerConnection.close();
        peerConnection=null;
    }

    document.getElementById('video-container').style.display='none';
    isVideoOn=false;
}

/* WebRTC */
socket.on('webrtc_offer', async d=>{
    createPeer();
    await peerConnection.setRemoteDescription(new RTCSessionDescription(d));

    const answer=await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);

    socket.emit('webrtc_answer',answer);
});

socket.on('webrtc_answer', async d=>{
    await peerConnection.setRemoteDescription(new RTCSessionDescription(d));
});

socket.on('webrtc_ice', async d=>{
    await peerConnection.addIceCandidate(new RTCIceCandidate(d));
});
</script>

</body>
</html>
