<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI';
    background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.container {
    background: rgba(255,255,255,0.05);
    padding:30px;
    border-radius:15px;
    backdrop-filter: blur(10px);
    width:90%;
    max-width:350px;
    text-align:center;
}

input {
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:25px;
    background:rgba(255,255,255,0.1);
    color:white;
}

button {
    width:100%;
    padding:12px;
    border:none;
    border-radius:25px;
    background:#e94560;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

a {
    color:#e94560;
    text-decoration:none;
}
</style>

</head>

<body>

<div class="container">
    <h2>Login 🔐</h2>

    <form method="POST">
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <p>Account nahi hai? <a href="/signup">Signup</a></p>
</div>

</body>
</html>
